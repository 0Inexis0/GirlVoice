name: Build desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Windows'
        run: npm run test:desktop
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - if: runner.os == 'Windows'
        run: npm run pack:win
      - if: runner.os == 'Linux'
        run: npm run pack:linux
      - uses: actions/upload-artifact@v4
        with:
          name: GirlVoice-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
